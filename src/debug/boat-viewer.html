<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Boat viewer</title>
  <!-- Стенд модели лодки: 4 ракурса на одном кадре. Открывать с корня проекта: /src/debug/boat-viewer.html
       Параметры URL: boom (°, <0 — левый борт), sheet (°), reef (0..2), furl (0..1 — парус спущен), awa (°), aws (м/с), heel (°),
       rudder (°), board (0..1), status (fill|luff|gybe), flutter (0..1), crew (0/1), water (0/1), views (ortho|detail|pennant|fittings), cam (x,y,z,tx,ty,tz), t (с) -->
  <style>html, body { margin: 0; height: 100%; background: #8fb6cf; overflow: hidden; } canvas { display: block; }
    .lbl { position: absolute; font: 12px sans-serif; color: #fff; background: #0006; padding: 2px 6px; }</style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { DEG } from '../config.js';
import { createBoatMesh } from '../scene/boat-mesh.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? parseFloat(q.get(k)) : d);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setScissorTest(true);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc3dc);
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x2b6f9a, 0.8));
const sun = new THREE.DirectionalLight(0xfff2d8, 2.4);
sun.position.set(-8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 10, bottom: -4 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
// полупрозрачная вода на уровне ВЛ, чтобы видеть и надводную, и подводную часть
const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x5d9cc2, transparent: true, opacity: 0.22, roughness: 0.3 }));
water.receiveShadow = true;
water.visible = num('water', 1) > 0;
scene.add(water);

const mesh = createBoatMesh();
scene.add(mesh.group);
mesh.setCrewVisible(num('crew', 1) > 0);

const boat = {
  x: 0, y: 0, z: 0, theta: 0, psi: 0, phi: num('heel', 0) * DEG,
  board: num('board', 1), rudder: num('rudder', 0) * DEG, crewY: 0, cfg: { crewMaxY: 1.15 },
  aw: { awa: num('awa', 45) * DEG, aws: num('aws', 6), twa: 0, tws: 0 },
  sail: { boom: num('boom', 25) * DEG, sheet: num('sheet', 25) * DEG, reefLevel: num('reef', 0),
    status: q.get('status') || 'fill', flutter: num('flutter', 0), furl: num('furl', 0) },
};
// прогреваем анимацию (вымпел, сглаживание), затем фиксируем кадр в момент t
const T = num('t', 3);
for (let t = 0; t <= T; t += 1 / 60) mesh.update(boat, t);
window.__boat = boat; window.__mesh = mesh;

// ракурсы: [позиция камеры, цель, fov, подпись]
const VIEWS = [
  [[6.5, 2.6, -6.5], [0, 0.9, -0.3], 42, '3/4 спереди'],
  [[17, 2.5, 0], [0, 3.6, 0], 38, 'борт'],
  [[-3.2, 5.2, 6.0], [0, 0.4, 0.3], 45, 'корма сверху'],
  [[-12, 3, -5], [0, 3.8, -0.5], 50, '3/4 сзади слева'],
];
// views=detail — крупные планы такелажа: топ мачты, корма с погоном, гик сбоку, основание мачты
const DETAIL = [
  [[3.5, 8.5, 2.5], [0, 7.6, -1.2], 40, 'топ и гафель'],
  [[2.2, 2.4, 5.2], [0, 1.0, 2.6], 45, 'корма, гика-шкот'],
  [[7, 2.6, 2.5], [0, 2.0, 0.5], 45, 'гик сбоку'],
  [[2.4, 1.9, -4.4], [0, 1.2, -2.4], 45, 'основание мачты'],
];
// views=pennant — вымпел на топе: борт, сзади, сверху, 3/4
const PENNANT = [
  [[5.5, 8.6, -1.8], [0, 8.4, -1.6], 40, 'вымпел: правый борт'],
  [[0, 9.0, 3.2], [0, 8.4, -2.0], 40, 'вымпел: сзади'],
  [[0.01, 13.0, -2.0], [0, 8.6, -2.0], 40, 'вымпел: сверху (нос справа)'],
  [[3.4, 9.6, -6.6], [0, 8.4, -1.8], 40, 'вымпел: 3/4 спереди'],
];
// views=fittings — фурнитура: рубка с иллюминаторами и поручнями, бак, кокпит сверху, ходовой огонь
const FITTINGS = [
  [[3.0, 1.9, -0.6], [0.6, 1.0, -0.2], 45, 'рубка: иллюминаторы, поручни'],
  [[1.4, 2.0, -4.2], [0, 0.9, -2.3], 45, 'бак: роульс, утка, бухта'],
  [[-0.6, 1.7, 0.6], [-0.2, 0.3, 2.6], 45, 'кокпит к корме: пайолы, кранцы'],
  [[0.35, 8.6, -3.6], [0, 8.45, -2.4], 35, 'топ: трёхцветный огонь (спереди справа)'],
];
const detail = q.get('views') === 'detail';
if (detail) VIEWS.splice(0, 4, ...DETAIL);
if (q.get('views') === 'pennant') VIEWS.splice(0, 4, ...PENNANT);
if (q.get('views') === 'fittings') VIEWS.splice(0, 4, ...FITTINGS);
// cam=x,y,z,tx,ty,tz — заменяет первый ракурс произвольной камерой
if (q.has('cam')) { const c = q.get('cam').split(',').map(Number); VIEWS[0] = [c.slice(0, 3), c.slice(3, 6), 45, 'cam']; }
// views=ortho — ортогональные проекции для сверки с чертежом: [позиция, up, центр кадра, полувысота кадра, подпись]
const ORTHO = [
  [[0, 30, 0], [1, 0, 0], [0, 0, 0.4], 2.4, 'сверху (нос слева)'],
  [[30, 0, 0], [0, 1, 0], [0, 0.3, 0.4], 2.4, 'борт (нос справа)'],
  [[0, 0, -30], [0, 1, 0], [0, 0.4, 0], 1.3, 'нос'],
  [[0, 0, 30], [0, 1, 0], [0, 0.4, 0], 1.3, 'корма'],
];
const ortho = q.get('views') === 'ortho';
const cams = ortho
  ? ORTHO.map(([p, up, t, hh]) => {
    const c = new THREE.OrthographicCamera(-hh, hh, hh, -hh, 0.1, 100);
    c.userData.hh = hh; c.up.set(...up); c.position.set(p[0] + t[0], p[1] + t[1], p[2] + t[2]); c.lookAt(...t); return c;
  })
  : VIEWS.map(([p, t, fov]) => {
    const c = new THREE.PerspectiveCamera(fov, 1, 0.1, 200);
    c.position.set(...p); c.lookAt(...t); return c;
  });
(ortho ? ORTHO.map((v) => [0, 0, 0, v[4]]) : VIEWS).forEach(([, , , name], i) => {
  const d = document.createElement('div');
  d.className = 'lbl'; d.textContent = name;
  d.style.left = (i % 2 ? 50 : 0) + '%'; d.style.top = (i > 1 ? 50 : 0) + '%';
  document.body.appendChild(d);
});

function render() {
  const w = innerWidth / 2, h = innerHeight / 2;
  cams.forEach((c, i) => {
    const x = (i % 2) * w, y = (i > 1 ? 0 : h);
    if (c.isOrthographicCamera) { const hh = c.userData.hh; c.left = -hh * w / h; c.right = hh * w / h; c.top = hh; c.bottom = -hh; }
    else c.aspect = w / h;
    c.updateProjectionMatrix();
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
    renderer.render(scene, c);
  });
}
render();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); render(); });
</script>
</body>
</html>
