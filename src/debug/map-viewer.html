<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Map viewer</title>
  <!-- Стенд карты мира: острова, буи и карта берега тем же кодом, что в игре. Открывать с корня проекта: /src/debug/map-viewer.html
       Управление: ЛКМ — тащить карту, WASD — двигаться (Shift — быстрее), Ctrl + мышь — угол к горизонту (Y) и курс (X),
       колесо — высота камеры.
       Параметры URL: layers (через запятую: terrain,depth,dist,normal,sites,grid,labels; по умолчанию terrain,grid,labels),
       cam (x,z,h,pitch,yaw — точка камеры, высота м, угол к горизонту °, курс ° от севера по часовой) -->
  <style>html, body { margin: 0; height: 100%; background: #2d5f80; overflow: hidden; font: 12px sans-serif; } canvas { display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .lbl { position: absolute; transform: translate(-50%, -50%); color: #fff; background: #0008; padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
    .lbl.island { font-size: 13px; font-weight: bold; transform: translate(-50%, -130%); }
    .lbl.coord { background: none; color: #fffc; text-shadow: 0 0 3px #000; padding: 0; }
    .buoy { position: absolute; width: 9px; height: 9px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); }
    #panel { position: absolute; top: 8px; left: 8px; color: #fff; background: #000a; padding: 6px 10px; border-radius: 4px; user-select: none; }
    #panel label { display: block; line-height: 20px; cursor: pointer; }
    #status { position: absolute; left: 8px; bottom: 8px; color: #fff; background: #000a; padding: 4px 8px; border-radius: 4px; font-family: ui-monospace, monospace; white-space: pre; }
    #help { position: absolute; right: 8px; bottom: 8px; color: #fffc; background: #000a; padding: 4px 8px; border-radius: 4px; }</style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
<div id="labels"></div>
<div id="panel"></div>
<div id="status"></div>
<div id="help">ЛКМ — тащить · WASD — ход (Shift — быстрее) · Ctrl+мышь — наклон и курс · колесо — высота</div>
<script type="module">
import * as THREE from 'three';
import { DEG, SCENE } from '../config.js';
import { createEnvironment } from '../scene/environment.js';
import { bakeShoreMap } from '../scene/shore-map.js';

const q = new URLSearchParams(location.search);
const START = await (await fetch('../../start.json')).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// мир — тем же кодом и с тем же сидом, что в игре; небо, облака и туман не нужны
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2d5f80);
const env = createEnvironment(scene, { ...SCENE, timeOfDay: 0.5, shadowSize: 4096 });
env.sky.mesh.visible = false;
env.clouds.group.visible = false;
scene.fog = null;
const shores = env.islands.map((g) => g.userData.shore);
const shoreMap = bakeShoreMap(shores);
const [bx, bz, bw, bh] = shoreMap.bounds.toArray();

// тень на весь мир: солнце над центром карты берега
const sun = env.sun, sc = sun.shadow.camera;
const half = Math.max(bw, bh) / 2 + 20;
sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.near = 1; sc.far = 2000;
sc.updateProjectionMatrix();
sun.shadow.normalBias = 0.3;
sun.target.position.set(bx + bw / 2, 0, bz + bh / 2);
sun.position.copy(env.sunDir).multiplyScalar(800).add(sun.target.position);

// вода и оверлеи карты берега; каналы декодируются как shoreInfo в water-fx.js
const sea = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: {
    uShoreTex: { value: shoreMap.texture }, uShoreBounds: { value: shoreMap.bounds },
    uShoreRange: { value: shoreMap.range }, uShoreDepth: { value: shoreMap.maxDepth },
    uDepth: { value: 0 }, uDist: { value: 0 }, uNormal: { value: 0 },
  },
  vertexShader: `
    varying vec2 vXZ;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vXZ = wp.xz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform sampler2D uShoreTex; uniform vec4 uShoreBounds; uniform float uShoreRange, uShoreDepth;
    uniform float uDepth, uDist, uNormal;
    varying vec2 vXZ;
    vec3 ramp(float t) { // мелко — бирюза, глубоко — синий
      return mix(mix(vec3(0.95, 0.9, 0.55), vec3(0.2, 0.85, 0.75), smoothstep(0.0, 0.35, t)), vec3(0.05, 0.15, 0.55), smoothstep(0.35, 1.0, t));
    }
    void main() {
      vec2 uv = (vXZ - uShoreBounds.xy) / uShoreBounds.zw;
      bool inMap = all(greaterThanEqual(uv, vec2(0.0))) && all(lessThanEqual(uv, vec2(1.0)));
      vec4 t = inMap ? texture2D(uShoreTex, uv) : vec4(1.0, 1.0, 0.5, 0.5);
      float dist = (t.r * 2.0 - 1.0) * uShoreRange, depth = t.g * uShoreDepth;
      float k = depth / uShoreDepth;
      vec3 col = mix(vec3(0.42, 0.72, 0.78), vec3(0.17, 0.37, 0.5), sqrt(k));
      if (uDepth > 0.5) col = ramp(k);
      if (uNormal > 0.5) col = mix(col, vec3(t.b, 0.5, t.a), inMap ? 0.85 : 0.0);
      if (uDist > 0.5) {
        // знак: вода — тёплый оттенок не трогаем, суша — затемнение; изолинии через 2 м, кромка жирнее
        if (dist < 0.0) col *= 0.55;
        float d = abs(dist) / 2.0, w = fwidth(d);
        float line = 1.0 - smoothstep(0.0, w * 1.2, min(fract(d), 1.0 - fract(d)));
        if (abs(dist) < uShoreRange - 0.5) col = mix(col, vec3(1.0), line * 0.6);
        float edge = 1.0 - smoothstep(0.0, fwidth(dist) * 2.0, abs(dist));
        col = mix(col, vec3(1.0, 0.25, 0.2), edge);
      }
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sea.receiveShadow = false;
scene.add(sea);

// точки прибоя: цвет по круче, скалы белые
const sites = (() => {
  const s = shoreMap.sites, pos = new Float32Array(s.count * 3), col = new Float32Array(s.count * 3);
  const c = new THREE.Color(), lo = new THREE.Color(0x40c8ff), hi = new THREE.Color(0xff3020);
  for (let n = 0; n < s.count; n++) {
    pos.set([s.x[n], 0.3, s.z[n]], n * 3);
    if (s.rock[n]) c.set(0xffffff); else c.copy(lo).lerp(hi, s.steep[n]);
    col.set([c.r, c.g, c.b], n * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ size: 5, sizeAttenuation: false, vertexColors: true }));
})();
sites.renderOrder = 2;
scene.add(sites);

// сетка 50 м (каждая вторая линия ярче) и рамка карты берега
const GRID = 50, GRID_EXT = 1000;
const grid = new THREE.Group();
function lines(pts, color, opacity) {
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
}
{
  const minor = [], major = [];
  for (let v = -GRID_EXT; v <= GRID_EXT; v += GRID) {
    const list = v % (2 * GRID) === 0 ? major : minor;
    list.push(new THREE.Vector3(v, 0.2, -GRID_EXT), new THREE.Vector3(v, 0.2, GRID_EXT));
    list.push(new THREE.Vector3(-GRID_EXT, 0.2, v), new THREE.Vector3(GRID_EXT, 0.2, v));
  }
  grid.add(lines(minor, 0xffffff, 0.12), lines(major, 0xffffff, 0.3));
  const y = 0.25, c = [[bx, bz], [bx + bw, bz], [bx + bw, bz + bh], [bx, bz + bh]].map(([x, z]) => new THREE.Vector3(x, y, z));
  grid.add(lines([c[0], c[1], c[1], c[2], c[2], c[3], c[3], c[0]], 0xffd040, 0.8));
}
scene.add(grid);

// подписи: острова, буи, старт лодки, квадрат воды вокруг старта
const labelsEl = document.getElementById('labels');
const marks = []; // { el, p: Vector3 }
function mark(cls, text, p) {
  const el = document.createElement('div');
  el.className = cls;
  if (text) el.textContent = text;
  labelsEl.appendChild(el);
  marks.push({ el, p });
  return el;
}
const labels = new THREE.Group();
let startArrow;
SCENE.islands.forEach((d) => mark('lbl island', d.name ?? `${d.x},${d.z}`, new THREE.Vector3(d.x, d.h, d.z)));
SCENE.buoys.forEach((d) => { mark('buoy', '', new THREE.Vector3(d.x, 1, d.z)).style.background = '#' + d.color.toString(16).padStart(6, '0'); });
{
  const b = START.boat;
  mark('lbl', 'старт', new THREE.Vector3(b.x, 6, b.z)).style.transform = 'translate(-50%, -160%)';
  const arrow = new THREE.Mesh(new THREE.ConeGeometry(2.5, 9, 3).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffd040, depthTest: false }));
  arrow.position.set(b.x, 1, b.z);
  arrow.rotation.y = -b.headingDeg * DEG;
  startArrow = arrow;
  arrow.renderOrder = 3;
  const s = SCENE.waterSize / 2, y = 0.3;
  const c = [[-s, -s], [s, -s], [s, s], [-s, s]].map(([x, z]) => new THREE.Vector3(b.x + x, y, b.z + z));
  labels.add(arrow, lines([c[0], c[1], c[1], c[2], c[2], c[3], c[3], c[0]], 0x9fe8ff, 0.6));
}
scene.add(labels);

// подписи координат сетки у нижнего и левого края кадра
const coordEls = [];
function coordLabel(i) {
  if (!coordEls[i]) { const el = document.createElement('div'); el.className = 'lbl coord'; labelsEl.appendChild(el); coordEls[i] = el; }
  return coordEls[i];
}

// камера: точка (x, z), высота h, угол к горизонту pitch (90° — вниз), курс yaw (0 — север, −z, по часовой)
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 8000);
camera.rotation.order = 'YXZ';
const view = (() => {
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity;
  for (const d of SCENE.islands) { x0 = Math.min(x0, d.x - d.r); x1 = Math.max(x1, d.x + d.r); z0 = Math.min(z0, d.z - d.r); z1 = Math.max(z1, d.z + d.r); }
  for (const d of SCENE.buoys) { x0 = Math.min(x0, d.x); x1 = Math.max(x1, d.x); z0 = Math.min(z0, d.z); z1 = Math.max(z1, d.z); }
  const tan = Math.tan(camera.fov / 2 * DEG);
  const h = 1.1 * Math.max((z1 - z0) / 2 / tan, (x1 - x0) / 2 / (tan * camera.aspect));
  return { x: (x0 + x1) / 2, z: (z0 + z1) / 2, h, pitch: 90, yaw: 0 };
})();
if (q.has('cam')) {
  const [x, z, h, pitch, yaw] = q.get('cam').split(',').map(Number);
  Object.assign(view, Object.fromEntries(Object.entries({ x, z, h, pitch, yaw }).filter(([, v]) => Number.isFinite(v))));
}
const H_MIN = 5, H_MAX = 1500, PITCH_MIN = 10, PITCH_MAX = 90;
function applyView() {
  view.h = Math.min(H_MAX, Math.max(H_MIN, view.h));
  view.pitch = Math.min(PITCH_MAX, Math.max(PITCH_MIN, view.pitch));
  view.yaw = ((view.yaw % 360) + 540) % 360 - 180;
  camera.position.set(view.x, view.h, view.z);
  camera.rotation.set(-view.pitch * DEG, -view.yaw * DEG, 0);
  camera.near = Math.max(0.2, view.h * 0.01);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
}

// точка плоскости y = 0 под точкой экрана (NDC), null — луч уходит выше горизонта
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(nx, ny, out = new THREE.Vector3()) {
  ray.setFromCamera({ x: nx, y: ny }, camera);
  return ray.ray.intersectPlane(plane, out);
}
const ndc = (e) => ({ x: (e.clientX / innerWidth) * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 });

// слои
const LAYERS = {
  terrain: (on) => { env.islands.forEach((g) => { g.visible = on; }); env.buoys.forEach((g) => { g.visible = on; }); },
  depth: (on) => { sea.material.uniforms.uDepth.value = +on; },
  dist: (on) => { sea.material.uniforms.uDist.value = +on; },
  normal: (on) => { sea.material.uniforms.uNormal.value = +on; },
  sites: (on) => { sites.visible = on; },
  grid: (on) => { grid.visible = on; coordEls.forEach((el) => { el.style.display = on ? '' : 'none'; }); },
  labels: (on) => { labels.visible = on; marks.forEach((m) => { m.el.hidden = !on; }); },
};
const NAMES = { terrain: 'рельеф', depth: 'глубина', dist: 'до берега', normal: 'нормаль берега', sites: 'точки прибоя', grid: 'сетка 50 м', labels: 'подписи' };
const layerOn = new Set((q.get('layers') ?? 'terrain,grid,labels').split(',').map((s) => s.trim()));
const panel = document.getElementById('panel');
for (const name of Object.keys(LAYERS)) {
  const lab = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = layerOn.has(name);
  cb.addEventListener('change', () => { cb.checked ? layerOn.add(name) : layerOn.delete(name); LAYERS[name](cb.checked); render(); });
  lab.append(cb, ' ' + NAMES[name]);
  panel.appendChild(lab);
  LAYERS[name](cb.checked);
}

// строка состояния: курсор и параметры камеры для URL
const statusEl = document.getElementById('status');
let cursor = null;
function terrainHeight(x, z) {
  let h = -Infinity;
  for (const s of shores) if (Math.hypot(x - s.x, z - s.z) < s.R * 1.3) h = Math.max(h, s.height(x, z));
  return h;
}
function updateStatus() {
  const f = (v, n = 1) => v.toFixed(n);
  let txt = `cam=${f(view.x, 0)},${f(view.z, 0)},${f(view.h, 0)},${f(view.pitch, 0)},${f(view.yaw, 0)}`;
  if (cursor) {
    const { x, z } = cursor, i = shoreMap.info(x, z), h = terrainHeight(x, z);
    txt += `\nx ${f(x)}  z ${f(z)}`;
    txt += h > 0 ? `  суша ${f(h)} м` : `  глубина ${f(i.depth)} м`;
    txt += Number.isFinite(i.dist) ? `  до берега ${f(i.dist)} м` : '  открытое море';
  }
  statusEl.textContent = txt;
}

const tmp = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
function place(el, p) {
  tmp.copy(p).project(camera);
  const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
  el.style.visibility = vis ? '' : 'hidden';
  if (vis) { el.style.left = `${(tmp.x + 1) / 2 * innerWidth}px`; el.style.top = `${(1 - tmp.y) / 2 * innerHeight}px`; }
  return vis;
}
// верхний край кадра на плоскости: при наклоне — последний ряд, где луч ещё бьёт в землю
function topRow(nx0, nx1) {
  for (let ny = 0.95; ny > -0.95; ny -= 0.03) if (groundAt(nx0, ny, a) && groundAt(nx1, ny, b)) return ny;
  return null;
}
function updateCoords() {
  let n = 0;
  if (layerOn.has('grid')) {
    const step = view.h > 600 ? 4 * GRID : 2 * GRID;
    // вдоль верхнего и правого края (там нет панелей); по каждому краю подписываем ось, что меняется сильнее
    const ny = topRow(-0.6, 0.97), edges = [];
    if (ny !== null) {
      edges.push([groundAt(-0.6, ny, a.clone()), groundAt(0.9, ny, b.clone())]);
      edges.push([groundAt(0.96, ny - 0.08, a.clone()), groundAt(0.96, -0.85, b.clone())]);
    }
    for (const [p0, p1] of edges) {
      if (!p0 || !p1) continue;
      const axis = Math.abs(p1.x - p0.x) > Math.abs(p1.z - p0.z) ? 'x' : 'z';
      const v0 = Math.min(p0[axis], p1[axis]), v1 = Math.max(p0[axis], p1[axis]);
      for (let v = Math.ceil(v0 / step) * step; v <= v1 && n < 80; v += step) {
        const t = (v - p0[axis]) / (p1[axis] - p0[axis]);
        const el = coordLabel(n++);
        el.textContent = `${axis} ${v}`;
        el.style.display = '';
        place(el, tmp.copy(p0).lerp(p1, t).clone());
      }
    }
  }
  for (let i = n; i < coordEls.length; i++) coordEls[i].style.display = 'none';
}

function render() {
  applyView();
  startArrow.scale.setScalar(Math.max(1, view.h / 400)); // стрелка старта не теряется на высоте
  renderer.render(scene, camera);
  for (const m of marks) if (layerOn.has('labels')) place(m.el, m.p);
  updateCoords();
  updateStatus();
}

// управление
const keys = new Set();
let drag = null, last = 0, looping = false, shift = false;
const canvas = renderer.domElement;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || e.ctrlKey) return;
  const p = groundAt(ndc(e).x, ndc(e).y);
  if (p) { drag = p; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('pointermove', (e) => {
  const n = ndc(e);
  if (e.ctrlKey) {
    view.pitch += e.movementY * 0.3;
    view.yaw += e.movementX * 0.3;
    drag = null;
  } else if (drag) {
    applyView();
    const p = groundAt(n.x, n.y);
    if (p) { view.x += drag.x - p.x; view.z += drag.z - p.z; }
  }
  applyView();
  cursor = groundAt(n.x, n.y);
  render();
});
canvas.addEventListener('pointerleave', () => { cursor = null; updateStatus(); });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  view.h *= Math.pow(1.1, Math.sign(e.deltaY));
  render();
}, { passive: false });
const MOVE = { KeyW: [0, 1], KeyS: [0, -1], KeyA: [-1, 0], KeyD: [1, 0] };
addEventListener('keydown', (e) => {
  if (!MOVE[e.code]) return;
  keys.add(e.code);
  if (!looping) { looping = true; last = performance.now(); requestAnimationFrame(tick); }
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!keys.size) { looping = false; return; }
  let r = 0, f = 0;
  for (const k of keys) { r += MOVE[k][0]; f += MOVE[k][1]; }
  const speed = view.h * (shift ? 3 : 1);
  const y = view.yaw * DEG;
  view.x += (Math.sin(y) * f + Math.cos(y) * r) * speed * dt;
  view.z += (-Math.cos(y) * f + Math.sin(y) * r) * speed * dt;
  render();
  requestAnimationFrame(tick);
}
addEventListener('keydown', (e) => { shift = e.shiftKey; });
addEventListener('keyup', (e) => { shift = e.shiftKey; });

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  render();
});

render();
window.__map = { env, shoreMap, camera, view, render, scene };
</script>
</body>
</html>
